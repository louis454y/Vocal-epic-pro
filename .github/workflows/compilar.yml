name: Compilar Vocal Epic Pro (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-2022

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Release
        run: cmake --build build --config Release --parallel

      - name: Preparar archivos finales
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (!(Test-Path "build/VocalEpicPro_artefacts/Release/VST3")) {
            throw "No se encontro el plugin VST3 compilado"
          }
          Copy-Item -Recurse "build/VocalEpicPro_artefacts/Release/VST3" "dist/VST3"
          if (Test-Path "build/VocalEpicPro_artefacts/Release/Standalone") {
            Copy-Item -Recurse "build/VocalEpicPro_artefacts/Release/Standalone" "dist/Standalone"
          }
          Copy-Item LEEME.md "dist/"

      - name: Subir el plugin terminado
        uses: actions/upload-artifact@v4
        with:
          name: VocalEpicPro-2.0-Windows-VST3
          path: dist
